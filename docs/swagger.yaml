info:
  contact: {}
  description: Backend REST API for a booking system — portfolio project and a refresher
    on Go backend architecture.
  title: Booking Systems API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: invalid email or password
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Revoke a refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: The supplied refresh token is revoked as part of rotation; reusing
        it afterwards fails.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: invalid or expired refresh token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Rotate a refresh token for a new access/refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user with the "customer" role and returns an access/refresh
        token pair.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "409":
          description: email already registered
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Register a new user
      tags:
      - auth
  /bookings:
    post:
      consumes:
      - application/json
      description: 'Send an Idempotency-Key header to safely retry: a repeated request
        with the same key for the same customer returns the original booking instead
        of creating a duplicate.'
      parameters:
      - description: Client-generated key to dedupe retried requests
        in: header
        name: Idempotency-Key
        type: string
      - description: Booking details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_booking.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_booking.bookingResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
        "409":
          description: requested time overlaps an existing booking
          schema:
            allOf:
            - $ref: '#/definitions/github_com_domibowo_booking-systems_internal_platform_httpserver.Response'
            - properties:
                data:
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Create a booking (places a temporary hold pending payment)
      tags:
      - bookings
  /bookings/{bookingId}:
    get:
      description: Visible to the booking's own customer or the resource's business
